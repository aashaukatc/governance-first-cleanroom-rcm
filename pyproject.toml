[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-first-cleanroom-rcm"
version = "0.1.1"
description = "Synthetic reference implementation for governance-first healthcare RCM analytics intake and QA."
requires-python = ">=3.10"
authors = [{name = "Muhammad Aftab Shaukat"}]
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1", "reportlab>=4.2", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
