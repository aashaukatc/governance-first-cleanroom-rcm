name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release-v0.1.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to overwrite an existing immutable release
        shell: bash
        run: |
          if git rev-parse v0.1.1 >/dev/null 2>&1; then
            echo 'Tag v0.1.1 already exists. Create a new version instead of overwriting it.'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz zip
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' --no-build-isolation

      - name: Run reproducibility and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests run_demo.py
          python run_demo.py
          python -m pytest -q
          prohibited='(^|/)(phi|client_data|production_data|01_Raw)(/|$)'
          if git ls-files | grep -E "$prohibited"; then
            echo 'Prohibited operational-data path detected.'
            exit 1
          fi

      - name: Build publication assets
        run: python scripts/build_release_assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/Governance_First_Cleanroom_RCM_Working_Paper.docx \
                  publication/Governance_First_Cleanroom_RCM_Working_Paper.pdf \
                  docs/Governance_First_Cleanroom_RCM_Controls_and_Data_Dictionary.xlsx \
                  docs/architecture.png SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): generate v0.1.1 publication assets [skip ci]'
            git push origin HEAD:main
          fi

      - name: Create archival package
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output Governance_First_Cleanroom_RCM_Publication_Package_v0.1.1.zip HEAD
          sha256sum Governance_First_Cleanroom_RCM_Publication_Package_v0.1.1.zip > Governance_First_Cleanroom_RCM_Publication_Package_v0.1.1_SHA256.txt

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v0.1.1 -m 'Governance-First Clean-Room RCM Architecture v0.1.1'
          git push origin v0.1.1
          gh release create v0.1.1 \
            Governance_First_Cleanroom_RCM_Publication_Package_v0.1.1.zip \
            Governance_First_Cleanroom_RCM_Publication_Package_v0.1.1_SHA256.txt \
            publication/Governance_First_Cleanroom_RCM_Working_Paper.pdf \
            publication/Governance_First_Cleanroom_RCM_Working_Paper.docx \
            docs/Governance_First_Cleanroom_RCM_Controls_and_Data_Dictionary.xlsx \
            --title 'Governance-First Clean-Room RCM Architecture v0.1.1' \
            --notes-file RELEASE_NOTES.md

      - name: Close publication tracking issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 2 --comment 'Published v0.1.1. Zenodo can now archive the GitHub Release.' || true
