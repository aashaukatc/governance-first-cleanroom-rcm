name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' --no-build-isolation

      - name: Compile sources
        run: python -m compileall -q src scripts tests run_demo.py

      - name: Run synthetic demonstration
        run: python run_demo.py

      - name: Run acceptance tests
        run: python -m pytest -q

      - name: Enforce public-data boundary
        shell: bash
        run: |
          set -euo pipefail
          prohibited='(^|/)(phi|client_data|production_data|01_Raw)(/|$)'
          if git ls-files | grep -E "$prohibited"; then
            echo 'Prohibited operational-data path detected.'
            exit 1
          fi
